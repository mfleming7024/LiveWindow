<style>
  /* Overlay root limited to top half for subtle aurora appearance */
  .overlay-root{position:absolute;left:0;right:0;top:0;height:50vh;pointer-events:none;overflow:hidden}
  .overlay-root .aurora-canvas{width:100%;height:100%;display:block}
  /* Fallback soft gradient if WebGL/three fails */
  .aurora-fallback{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg, rgba(10,20,40,0.0) 0%, rgba(10,40,60,0.08) 30%, rgba(50,0,80,0.06) 45%, rgba(20,80,40,0.05) 55%, transparent 80%);filter:blur(12px);mix-blend-mode:screen}
</style>
<div class="overlay-root" data-quality="high" aria-hidden="true">
  <canvas class="aurora-canvas" role="img" aria-label="aurora"></canvas>
  <div class="aurora-fallback" aria-hidden="true"></div>
</div>
<script>
(function(){
  // Consolidated three.js aurora overlay
  var renderer, scene, camera, mesh, animationId, container, pixelRatio = window.devicePixelRatio || 1;

  function ensureThree(){
    if(window.THREE) return Promise.resolve();
    if (window.OverlayCommon && window.OverlayCommon.loadThree) return window.OverlayCommon.loadThree();
    return new Promise(function(res,rej){
      var s=document.createElement('script'); s.src='https://unpkg.com/three@0.158.0/build/three.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s);
    });
  }

  function createMaterial(){
    var uniforms = {
      time: { value: 0 },
      resolution: { value: new THREE.Vector2(512,256) },
      intensity: { value: 1.0 },
      speed: { value: 0.7 },
      bandScale: { value: 1.6 }
    };

    var vertexShader = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position,1.0);} `;

    var fragmentShader = `
      uniform float time; uniform vec2 resolution; uniform float intensity; uniform float speed; uniform float bandScale; varying vec2 vUv;

      float hash21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }

      float bandNoise(vec2 uv){
        float t = time * 0.001 * speed;
        float n = 0.0;
        float amp = 1.0;
        float freq = 1.0;
        for(int i=0;i<5;i++){
          n += (sin((uv.x*freq + uv.y*0.25) * 3.1415 * 2.0 + t * (0.2 + float(i)*0.12)) * 0.5 + 0.5) * amp;
          freq *= 1.9; amp *= 0.55;
        }
        return n;
      }

      void main(){
        vec2 uv = vUv;
        float vfall = smoothstep(0.9, -0.15, uv.y);
        float bands = bandNoise(vec2(uv.x * bandScale, uv.y * 0.6));
        float g = smoothstep(0.35, 0.78, bands + 0.05 * sin(time*0.0008 + uv.x*6.0));
        float p = smoothstep(0.2, 0.7, bands - 0.22 + 0.06 * cos(time*0.0006 + uv.x*4.0));
        float r = smoothstep(0.1, 0.6, bands - 0.45 + 0.05 * sin(time*0.0009 + uv.x*2.0));
        vec3 green = vec3(0.05,0.7,0.35);
        vec3 purple = vec3(0.66,0.16,0.6);
        vec3 red = vec3(0.92,0.22,0.3);
        vec3 highlight = vec3(0.9,1.0,0.95);
        float shimmer = hash21(uv*resolution.xy + time*0.001) * 0.08;
        vec3 col = g * green + p * purple + r * red;
        col = mix(col, highlight, 0.07 * (g + p));
        float alpha = (g + p*0.9 + r*0.7) * 0.6 * vfall * intensity + shimmer;
        alpha *= smoothstep(0.0, 0.8, 1.0 - uv.y);
        col = pow(col, vec3(1.0/1.05));
        gl_FragColor = vec4(col * 1.05, clamp(alpha, 0.0, 1.0));
      }
    `;

    return new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: uniforms,
      vertexShader: vertexShader,
      fragmentShader: fragmentShader
    });
  }

  function init(){
    var canvas = container.querySelector('.aurora-canvas');
    renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(pixelRatio);
    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
    camera.position.z = 1;
    var geom = new THREE.PlaneGeometry(2,2);
    var mat = createMaterial();
    mesh = new THREE.Mesh(geom, mat);
    scene.add(mesh);
    onResize();
    window.addEventListener('resize', onResize);
  }

  function animate(t){ if(!mesh) return; mesh.material.uniforms.time.value = t; mesh.material.uniforms.bandScale.value = 1.4 + 0.25 * Math.sin(t*0.0008); renderer.render(scene, camera); animationId = requestAnimationFrame(animate); }
  function onResize(){ if(!renderer) return; var w = container.clientWidth, h = container.clientHeight; renderer.setSize(w,h,false); if(mesh && mesh.material && mesh.material.uniforms) mesh.material.uniforms.resolution.value.set(w,h); }
  window.initOverlay = window.initOverlay || function(c){ container = c || document.body; ensureThree().then(function(){ init(); animationId = requestAnimationFrame(animate); }).catch(function(e){ console.warn('three load failed', e); }); };
  window.destroyOverlay = window.destroyOverlay || function(){ if(animationId) cancelAnimationFrame(animationId); animationId=null; try{ if(mesh){ if(mesh.geometry) mesh.geometry.dispose(); if(mesh.material){ mesh.material.dispose(); } scene.remove(mesh); mesh=null; } if(renderer){ renderer.dispose(); if(renderer.domElement && renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); renderer=null; } window.removeEventListener('resize', onResize); }catch(e){ console.error(e);} scene=camera=null; };

})();
</script>

<script>
if (window.top !== window.self) {
  document.addEventListener('DOMContentLoaded', function () { var c = document.querySelector('.overlay-root') || document.body; if (window.initOverlay) window.initOverlay(c); });
  window.addEventListener('unload', function () { if (window.destroyOverlay) window.destroyOverlay(); });
}
</script>
