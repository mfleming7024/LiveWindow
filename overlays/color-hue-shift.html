<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;}</style>
</head>
<body>
  <div id="overlay-root"></div>
  <script src="/overlays/vendor/three.min.js"></script>
  <script src="/overlays/overlay-common.js"></script>
  <script>
    (function(){
      // Hue Shift - Cycles colors through the spectrum
      var container=document.getElementById('overlay-root'); 
      var renderer=new THREE.WebGLRenderer({alpha:true}); 
      renderer.setSize(window.innerWidth,window.innerHeight); 
      container.appendChild(renderer.domElement);
      
      var scene=new THREE.Scene(); 
      var camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
      
      var uniforms={
        time:{value:0},
        resolution:{value:new THREE.Vector2(window.innerWidth,window.innerHeight)},
        speed:{value:0.5}, 
        tDiffuse:{value:null}, 
        hasTexture:{value:0.0}
      };
      
      var frag=`
        varying vec2 vUv; 
        uniform float time; 
        uniform float speed;
        uniform sampler2D tDiffuse; 
        uniform float hasTexture;

        // RGB to HSV conversion
        vec3 rgb2hsv(vec3 c) {
            vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
            vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
            vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));

            float d = q.x - min(q.w, q.y);
            float e = 1.0e-10;
            return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
        }

        // HSV to RGB conversion
        vec3 hsv2rgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        void main(){ 
          vec2 uv = vUv;
          
          if (hasTexture > 0.5) {
            vec4 texColor = texture2D(tDiffuse, uv);
            vec3 hsv = rgb2hsv(texColor.rgb);
            
            // Shift hue over time
            hsv.x = fract(hsv.x + time * speed * 0.1);
            
            vec3 finalColor = hsv2rgb(hsv);
            gl_FragColor = vec4(finalColor, texColor.a);
          } else {
            // Fallback visualization
            vec3 color = 0.5 + 0.5 * cos(time + uv.xyx + vec3(0,2,4));
            gl_FragColor = vec4(color, 0.55); 
          }
        }
      `;
      
      var mat=new THREE.ShaderMaterial({
        transparent:true,
        uniforms:uniforms,
        vertexShader:'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.0);}',
        fragmentShader:frag
      }); 
      
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat)); 
      
      window.addEventListener('resize', function(){ 
        renderer.setSize(window.innerWidth,window.innerHeight); 
        uniforms.resolution.value.set(window.innerWidth,window.innerHeight);
      }, {passive:true}); 
      
      var t=0; 
      function animate(){ 
        requestAnimationFrame(animate); 
        t+=0.016; 
        uniforms.time.value=t; 
        renderer.render(scene,camera);
      } 
      
      if (window.OverlayCommon && OverlayCommon.loadBackgroundTexture) {
        OverlayCommon.loadBackgroundTexture().then(function(tex){
          if(tex) { 
            uniforms.tDiffuse.value = tex; 
            uniforms.hasTexture.value = 1.0; 
          }
          animate();
        });
      } else {
        animate();
      }
    })();
  </script>
</body>
</html>
