<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;}</style>
</head>
<body>
  <div id="overlay-root"></div>
  <script src="vendor/three.min.js"></script>
  <script src="overlay-common.js"></script>
  <script>
    (function(){
      // Night Vision - Green tint, scanlines, and noise
      var container=document.getElementById('overlay-root'); 
      var renderer=new THREE.WebGLRenderer({alpha:true}); 
      renderer.setSize(window.innerWidth,window.innerHeight); 
      container.appendChild(renderer.domElement);
      
      var scene=new THREE.Scene(); 
      var camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
      
      var uniforms={
        time:{value:0},
        resolution:{value:new THREE.Vector2(window.innerWidth,window.innerHeight)},
        tDiffuse:{value:null}, 
        hasTexture:{value:0.0}
      };
      
      var frag=`
        varying vec2 vUv; 
        uniform float time; 
        uniform sampler2D tDiffuse; 
        uniform float hasTexture;

        float rand(vec2 co){
            return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
        }

        void main(){ 
          vec2 uv = vUv;
          
          vec4 color = vec4(1.0);
          if (hasTexture > 0.5) {
            color = texture2D(tDiffuse, uv);
          } else {
            // Fallback
            color = vec4(vec3(0.1), 1.0);
          }
          
          // Grayscale
          float gray = dot(color.rgb, vec3(0.299, 0.587, 0.114));
          
          // Green tint boost
          vec3 nightVision = vec3(0.0, gray * 1.5, 0.0);
          
          // Scanlines
          float scanline = sin(uv.y * 800.0 + time * 10.0) * 0.1;
          nightVision -= scanline;
          
          // Noise
          float noise = rand(uv + time) * 0.2;
          nightVision += noise;
          
          // Vignette
          vec2 dist = uv - 0.5;
          float vignette = 1.0 - dot(dist, dist) * 2.0;
          nightVision *= smoothstep(0.0, 1.0, vignette);
          
          // Brightness boost for "night vision" feel
          nightVision *= 1.2;

          gl_FragColor = vec4(nightVision, color.a);
        }
      `;
      
      var mat=new THREE.ShaderMaterial({
        transparent:true,
        uniforms:uniforms,
        vertexShader:'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.0);}',
        fragmentShader:frag
      }); 
      
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat)); 
      
      window.addEventListener('resize', function(){ 
        renderer.setSize(window.innerWidth,window.innerHeight); 
        uniforms.resolution.value.set(window.innerWidth,window.innerHeight);
      }, {passive:true}); 
      
      var t=0; 
      function animate(){ 
        requestAnimationFrame(animate); 
        t+=0.016; 
        uniforms.time.value=t; 
        renderer.render(scene,camera);
      } 
      
      if (window.OverlayCommon && OverlayCommon.loadBackgroundTexture) {
        OverlayCommon.loadBackgroundTexture().then(function(tex){
          if(tex) { 
            uniforms.tDiffuse.value = tex; 
            uniforms.hasTexture.value = 1.0; 
          }
          animate();
        });
      } else {
        animate();
      }
    })();
  </script>
</body>
</html>
