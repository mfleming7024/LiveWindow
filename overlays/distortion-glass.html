<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;}</style>
</head>
<body>
  <div id="overlay-root"></div>
  <script src="/overlays/vendor/three.min.js"></script>
  <script src="/overlays/overlay-common.js"></script>
  <script>
    (function(){
      // Glass Distort - tessellated frosted glass appearance using small displacement tiles
      var container=document.getElementById('overlay-root'); var renderer=new THREE.WebGLRenderer({alpha:true}); renderer.setSize(window.innerWidth,window.innerHeight); container.appendChild(renderer.domElement);
      var scene=new THREE.Scene(); var camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
      var uniforms={time:{value:0},resolution:{value:new THREE.Vector2(window.innerWidth,window.innerHeight)},tile:{value:40.0},strength:{value:0.02}, tDiffuse:{value:null}, hasTexture:{value:0.0}};
      var frag=`
        varying vec2 vUv; uniform float time; uniform vec2 resolution; uniform float tile; uniform float strength;
        uniform sampler2D tDiffuse; uniform float hasTexture;
        float rand(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);} 
        void main(){ 
          vec2 uv=vUv; vec2 gv = floor(uv*tile)/tile; float n = rand(gv + floor(time*0.1)); 
          vec2 distortedUv = uv + (n-0.5)*strength; 
          if (hasTexture > 0.5) {
            gl_FragColor = texture2D(tDiffuse, distortedUv);
          } else {
            float mask = 1.0; gl_FragColor = vec4(1.0,1.0,1.0, mask*0.45);
          }
        } 
      `;
      var mat=new THREE.ShaderMaterial({transparent:true,uniforms:uniforms,vertexShader:'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.0);}',fragmentShader:frag});
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat)); 
      window.addEventListener('resize', function(){ renderer.setSize(window.innerWidth,window.innerHeight); uniforms.resolution.value.set(window.innerWidth,window.innerHeight);}, {passive:true}); 
      var t=0; 
      function animate(){ requestAnimationFrame(animate); t+=0.016; uniforms.time.value=t; renderer.render(scene,camera);} 
      
      if (window.OverlayCommon && OverlayCommon.loadBackgroundTexture) {
        OverlayCommon.loadBackgroundTexture().then(function(tex){
          if(tex) { uniforms.tDiffuse.value = tex; uniforms.hasTexture.value = 1.0; }
          animate();
        });
      } else {
        animate();
      }
    })();
  </script>
</body>
</html>
