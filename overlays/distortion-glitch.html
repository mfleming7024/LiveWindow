<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;}</style>
</head>
<body>
  <div id="overlay-root"></div>
  <script src="vendor/three.min.js"></script>
  <script src="overlay-common.js"></script>
  <script>
    (function(){
      // Glitch Distortion - Digital blocky artifacts and RGB shifting
      var container=document.getElementById('overlay-root'); 
      var renderer=new THREE.WebGLRenderer({alpha:true}); 
      renderer.setSize(window.innerWidth,window.innerHeight); 
      container.appendChild(renderer.domElement);
      
      var scene=new THREE.Scene(); 
      var camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
      
      var uniforms={
        time:{value:0},
        resolution:{value:new THREE.Vector2(window.innerWidth,window.innerHeight)},
        strength:{value:0.05}, 
        tDiffuse:{value:null}, 
        hasTexture:{value:0.0}
      };
      
      var frag=`
        varying vec2 vUv; 
        uniform float time; 
        uniform float strength;
        uniform sampler2D tDiffuse; 
        uniform float hasTexture;
        
        // Simple pseudo-random function
        float rand(vec2 co){
            return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
        }

        void main(){ 
          vec2 uv = vUv;
          
          // Create blocky noise for displacement
          float blockScale = 20.0;
          float noise = rand(vec2(floor(uv.y * blockScale), floor(time * 10.0)));
          
          // Only displace some blocks
          float displacement = 0.0;
          if(noise > 0.9) {
            displacement = (rand(vec2(time)) - 0.5) * strength * 2.0;
          }
          
          vec2 distortedUv = uv;
          distortedUv.x += displacement;
          
          if (hasTexture > 0.5) {
            // RGB Split for extra glitch feel
            float r = texture2D(tDiffuse, distortedUv + vec2(strength * 0.1, 0.0)).r;
            float g = texture2D(tDiffuse, distortedUv).g;
            float b = texture2D(tDiffuse, distortedUv - vec2(strength * 0.1, 0.0)).b;
            gl_FragColor = vec4(r, g, b, 1.0);
          } else {
            // Fallback visualization
            float c = 0.5 + 0.5 * sin(distortedUv.x * 50.0 + time * 5.0);
            gl_FragColor = vec4(c, c, c, 0.55); 
          }
        }
      `;
      
      var mat=new THREE.ShaderMaterial({
        transparent:true,
        uniforms:uniforms,
        vertexShader:'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.0);}',
        fragmentShader:frag
      }); 
      
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat)); 
      
      window.addEventListener('resize', function(){ 
        renderer.setSize(window.innerWidth,window.innerHeight); 
        uniforms.resolution.value.set(window.innerWidth,window.innerHeight);
      }, {passive:true}); 
      
      var t=0; 
      function animate(){ 
        requestAnimationFrame(animate); 
        t+=0.016; 
        uniforms.time.value=t; 
        renderer.render(scene,camera);
      } 
      
      if (window.OverlayCommon && OverlayCommon.loadBackgroundTexture) {
        OverlayCommon.loadBackgroundTexture().then(function(tex){
          if(tex) { 
            uniforms.tDiffuse.value = tex; 
            uniforms.hasTexture.value = 1.0; 
          }
          animate();
        });
      } else {
        animate();
      }
    })();
  </script>
</body>
</html>
