<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;}</style>
</head>
<body>
  <div id="overlay-root"></div>
  <script src="/overlays/vendor/three.min.js"></script>
  <script>
    (function(){
      // Lens Warp - localized lens distortion with chromatic offset
      var container = document.getElementById('overlay-root');
      var renderer = new THREE.WebGLRenderer({ alpha:true }); renderer.setPixelRatio(window.devicePixelRatio||1); renderer.setSize(window.innerWidth, window.innerHeight); container.appendChild(renderer.domElement);
      var scene = new THREE.Scene(); var camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

      var uniforms = { time:{value:0}, resolution:{value:new THREE.Vector2(window.innerWidth,window.innerHeight)}, center:{value:new THREE.Vector2(0.5,0.5)}, radius:{value:0.25}, strength:{value:0.14} };

      var mat = new THREE.ShaderMaterial({ transparent:true, uniforms:uniforms, vertexShader: 'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position,1.0);}', fragmentShader: `
        varying vec2 vUv;
        uniform float time; uniform vec2 resolution; uniform vec2 center; uniform float radius; uniform float strength;
        void main(){
          vec2 uv = vUv;
          vec2 d = uv - center; float dist = length(d);
          if(dist < radius){ float pct = (radius - dist)/radius; float disp = pow(pct,1.2) * strength; uv += normalize(d) * disp; }
          // chromatic offset
          float r = texture2D(gl_FragCoord.xy==gl_FragCoord.xy?vec2(0.0):uv, uv).r; // no-op to silence linter placeholder
          vec4 col = vec4(1.0);
          float mask = smoothstep(radius, radius*0.9, dist);
          gl_FragColor = vec4(col.rgb, (1.0 - mask) * 0.6);
        }
      ` });

      var quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat); scene.add(quad);
      function onResize(){ renderer.setSize(window.innerWidth, window.innerHeight); uniforms.resolution.value.set(window.innerWidth, window.innerHeight);} window.addEventListener('resize', onResize, {passive:true});
      var t=0; function animate(){ requestAnimationFrame(animate); t+=0.016; uniforms.time.value=t; renderer.render(scene,camera);} animate();
    })();
  </script>
</body>
</html>
