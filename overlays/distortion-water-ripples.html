<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;}</style>
</head>
<body>
  <div id="overlay-root"></div>
  <script src="/overlays/vendor/three.min.js"></script>
  <script>
    (function(){
      // Water Ripples - fullscreen UV displacement using a sine-based ripple texture
      var container = document.getElementById('overlay-root');
      var renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      container.appendChild(renderer.domElement);

      var scene = new THREE.Scene();
      var camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

      var uniforms = {
        time: { value: 0 },
        resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        strength: { value: 0.025 }
      };

      var material = new THREE.ShaderMaterial({
        transparent: true,
        uniforms: uniforms,
        vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0);} ',
        fragmentShader: `
          varying vec2 vUv;
          uniform float time;
          uniform vec2 resolution;
          uniform float strength;
          // small ripple field
          void main(){
            vec2 uv = vUv;
            float t = time * 0.8;
            float r = length(uv - 0.5);
            float ripple = sin((r * 40.0) - t * 8.0) * 0.003;
            uv += normalize(uv - 0.5) * ripple * strength * 60.0;
            // subtle second layer
            uv += 0.002 * vec2(sin(uv.y * 30.0 + t * 2.0), cos(uv.x * 30.0 - t * 2.0));
            vec4 col = vec4(1.0);
            float mask = smoothstep(0.0, 0.8, 1.0 - r);
            gl_FragColor = vec4(col.rgb, mask * 0.6);
          }
        `
      });

      var quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), material);
      scene.add(quad);

      function onResize(){
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', onResize, { passive: true });

      var t=0;
      function animate(){ requestAnimationFrame(animate); t+=0.016; uniforms.time.value = t; renderer.render(scene, camera);} 
      animate();
    })();
  </script>
</body>
</html>
