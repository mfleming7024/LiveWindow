<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Snow Animation</title>
    <style>
        /* --- Base Setup --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        /* --- Snow Container --- */
        #snow-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- Snowflake Styling --- */
        .snowflake {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0.8;
            
            /* Performance optimization */
            transform: translate3d(0, 0, 0);
            will-change: transform, opacity;
            backface-visibility: hidden;
            
            /* Box shadow creates a subtle glow */
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
            
            animation-name: snowFall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* --- Keyframe Animations --- */
        @keyframes snowFall {
            0% {
                transform: translate3d(var(--x-offset), -10vh, 0) rotateZ(0deg);
                opacity: 0;
            }
            5% {
                opacity: 0.8;
            }
            95% {
                opacity: 0.8;
            }
            100% {
                transform: translate3d(var(--x-offset), 110vh, 0) rotateZ(360deg);
                opacity: 0;
            }
        }

        /* --- Sway Animation for realistic movement --- */
        @keyframes sway {
            0%, 100% {
                transform: translateX(-50px);
            }
            50% {
                transform: translateX(50px);
            }
        }

        .snowflake.sway {
            animation: snowFall linear infinite, sway ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="snow-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('snow-container');
            const numberOfSnowflakes = 50; // Adjust for density

            for (let i = 0; i < numberOfSnowflakes; i++) {
                createSnowflake(container);
            }
        });

        function createSnowflake(container) {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            
            // Randomize snowflake properties
            const size = Math.random() * 8 + 4; // 4px to 12px
            snowflake.style.width = `${size}px`;
            snowflake.style.height = `${size}px`;

            // Random horizontal position
            const xStart = Math.random() * 100;
            snowflake.style.left = `${xStart}%`;
            snowflake.style.top = '-10vh';

            // Randomize fall duration (faster snowflakes = larger, slower = smaller)
            const duration = Math.random() * 15 + 10; // 10-25 seconds
            snowflake.style.setProperty('--x-offset', `${(Math.random() - 0.5) * 100}px`);
            snowflake.style.animationDuration = `${duration}s`;

            // Random animation delay
            const delay = Math.random() * 5;
            snowflake.style.animationDelay = `${delay}s`;

            // Random opacity variation
            const opacity = Math.random() * 0.3 + 0.5; // 0.5 to 0.8
            snowflake.style.opacity = opacity;

            // Add sway animation to some snowflakes
            if (Math.random() > 0.5) {
                snowflake.classList.add('sway');
                const swayDuration = Math.random() * 3 + 3; // 3-6 seconds
                snowflake.style.setProperty('--sway-duration', `${swayDuration}s`);
            }

            container.appendChild(snowflake);
        }
    </script>
</body>
</html>
