<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;}</style>
</head>
<body>
  <div id="overlay-root"></div>
  <script src="/overlays/vendor/three.min.js"></script>
  <script>
    (function(){
      // Magic Runes - translucent rotating rune circles
      var container = document.getElementById('overlay-root');
      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
      camera.position.z = 150;

      var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      container.appendChild(renderer.domElement);

      // Create multiple rune rings using torus geometry and a custom glow material
      var rings = new THREE.Group();

      function createRing(radius, segments, colorHex, lineWidth){
        var geometry = new THREE.RingGeometry(radius - lineWidth, radius + lineWidth, segments);
        // draw a basic texture with rune-like glyphs using canvas
        var size = 512;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,size,size);
        ctx.translate(size/2, size/2);
        ctx.rotate(Math.PI/2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.8;

        // draw glyph markers
        for (var i=0;i<12;i++){
          ctx.save();
          ctx.rotate((i/12) * Math.PI*2);
          ctx.beginPath();
          ctx.moveTo(radius*1.4, 0);
          ctx.lineTo((radius+lineWidth)*1.46, 0);
          ctx.stroke();
          ctx.restore();
        }

        var texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;

        var material = new THREE.MeshBasicMaterial({
          map: texture,
          color: colorHex,
          transparent: true,
          opacity: 0.35,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide
        });

        var mesh = new THREE.Mesh(geometry, material);
        mesh.rotation.x = Math.PI / 2;
        return mesh;
      }

      rings.add(createRing(18, 64, 0x66ccff, 2));
      rings.add(createRing(36, 64, 0xff88cc, 3));
      rings.add(createRing(60, 64, 0xaadd88, 4));

      rings.position.z = -50;
      scene.add(rings);

      // subtle particles to complement runes (use circular sprite so they render as soft circles)
      var particleGeo = new THREE.BufferGeometry();
      var positions = [];
      for (var i=0;i<60;i++){
        positions.push((Math.random()-0.5)*200, (Math.random()-0.5)*120, (Math.random()-0.5)*80 - 20);
      }
      particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

      function createCircleSprite(size, inner, outer){
        size = size || 128;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var cx = size/2, cy = size/2, r = size/2;
        var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        grad.addColorStop(0, inner || 'rgba(255,255,255,1)');
        grad.addColorStop(0.4, outer || 'rgba(200,220,255,0.7)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,size,size);
        return new THREE.CanvasTexture(canvas);
      }

      var particleTexture = createCircleSprite(128, 'rgba(255,255,255,1)', 'rgba(180,200,255,0.6)');
      var particleMat = new THREE.PointsMaterial({ size: 12, map: particleTexture, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
      particleMat.needsUpdate = true;
      var particles = new THREE.Points(particleGeo, particleMat);
      scene.add(particles);

      // pointer parallax
      var pointer = { x: 0, y: 0 };
      window.addEventListener('mousemove', function(e){
        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      }, { passive: true });

      function onResize(){
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', onResize, { passive: true });

      var t = 0;
      function animate(){
        requestAnimationFrame(animate);
        t += 0.01;
        rings.rotation.z = t * 0.15;
        rings.children.forEach(function(c, idx){
          c.rotation.z = t * (0.05 + idx*0.02) * (idx % 2 === 0 ? 1 : -1);
          c.material.opacity = 0.25 + 0.15 * Math.sin(t*2 + idx);
        });

        var positions = particleGeo.attributes.position.array;
        for (var i=0;i<positions.length; i+=3){
          positions[i+1] += Math.sin(t + i) * 0.02;
          positions[i] += Math.cos(t*0.6 + i) * 0.02;
        }
        particleGeo.attributes.position.needsUpdate = true;

        camera.position.x += (pointer.x * 30 - camera.position.x) * 0.03;
        camera.position.y += (pointer.y * 20 - camera.position.y) * 0.03;
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
      }

      animate();
    })();
  </script>
</body>
</html>
