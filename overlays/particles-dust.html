<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Dust Animation</title>
    <style>
        /* --- Base Setup --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        /* --- Particle Container --- */
        #particle-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- Dust Particle Styling --- */
        .dust-particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(200, 200, 200, 0.2));
            
            /* Performance optimization */
            transform: translate3d(0, 0, 0);
            will-change: transform, opacity;
            backface-visibility: hidden;
            
            animation-name: dustFloat;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        /* --- Floating Animation --- */
        @keyframes dustFloat {
            0% {
                transform: translate3d(var(--x-start), var(--y-start), 0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translate3d(var(--x-end), var(--y-end), 0) scale(0.3);
                opacity: 0;
            }
        }

        /* --- Spiral Animation --- */
        @keyframes dustSpiral {
            0% {
                transform: rotate(0deg) translateX(0px);
            }
            100% {
                transform: rotate(360deg) translateX(30px);
            }
        }

        .dust-particle.spiral {
            animation: dustFloat ease-in-out infinite, dustSpiral linear infinite;
        }

        /* --- Light Ray Container --- */
        #light-rays {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        /* --- Light Ray --- */
        .light-ray {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform-origin: top center;
            opacity: 0.4;
            filter: blur(10px);
            
            animation-name: rayShimmer;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        /* --- Ray Shimmer Animation --- */
        @keyframes rayShimmer {
            0%, 100% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>
    <div id="particle-container">
        <div id="light-rays"></div>
        <div id="particles"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const particleContainer = document.getElementById('particles');
            const raysContainer = document.getElementById('light-rays');
            
            // Create light rays
            for (let i = 0; i < 4; i++) {
                createLightRay(raysContainer, i);
            }

            // Create dust particles
            const numberOfParticles = 80;
            for (let i = 0; i < numberOfParticles; i++) {
                setTimeout(() => {
                    createDustParticle(particleContainer);
                }, i * 50);
            }

            // Continuously add particles for continuous effect
            setInterval(() => {
                if (particleContainer.children.length < numberOfParticles) {
                    createDustParticle(particleContainer);
                }
            }, 200);
        });

        function createDustParticle(container) {
            const particle = document.createElement('div');
            particle.className = 'dust-particle';
            
            // Random particle size
            const size = Math.random() * 6 + 2; // 2px to 8px
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;

            // Random starting position
            const startX = Math.random() * 100;
            const startY = Math.random() * 100;
            particle.style.left = `${startX}%`;
            particle.style.top = `${startY}%`;

            // Random end position for drift
            const endX = (Math.random() - 0.5) * 200;
            const endY = (Math.random() - 0.5) * 200;
            particle.style.setProperty('--x-start', '0');
            particle.style.setProperty('--y-start', '0');
            particle.style.setProperty('--x-end', `${endX}px`);
            particle.style.setProperty('--y-end', `${endY}px`);

            // Animation duration
            const duration = Math.random() * 15 + 8; // 8-23 seconds
            particle.style.animationDuration = `${duration}s`;

            // Random animation delay
            const delay = Math.random() * 10;
            particle.style.animationDelay = `${delay}s`;

            // Random opacity
            const opacity = Math.random() * 0.5 + 0.3; // 0.3 to 0.8
            particle.style.opacity = opacity;

            // Add spiral effect to some particles
            if (Math.random() > 0.7) {
                particle.classList.add('spiral');
            }

            // Remove particle after animation completes
            setTimeout(() => {
                particle.remove();
            }, (duration + delay) * 1000);

            container.appendChild(particle);
        }

        function createLightRay(container, index) {
            const ray = document.createElement('div');
            ray.className = 'light-ray';

            // Position rays at different angles
            const xPos = (index * 25) + 10;
            ray.style.left = `${xPos}%`;
            ray.style.top = '-50%';
            ray.style.width = '80px';
            ray.style.height = '200%';
            ray.style.transform = `rotate(${45 - index * 15}deg)`;

            // Animation properties
            const duration = Math.random() * 3 + 3; // 3-6 seconds
            ray.style.animationDuration = `${duration}s`;

            // Random delay
            const delay = Math.random() * 2;
            ray.style.animationDelay = `${delay}s`;

            container.appendChild(ray);
        }
    </script>
</body>
</html>
