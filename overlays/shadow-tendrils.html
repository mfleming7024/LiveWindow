<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shadow Tendrils</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    #shadow-tendrils-root {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: multiply;
    }

    /* Canvas will be injected and sized to cover the container */
    canvas.tendrils-canvas {
      display: block;
      width: 100%;
      height: 100%;
      filter: blur(18px) contrast(1.15) saturate(0.9);
    }

    /* Simple CSS fallback for when WebGL isn't available */
    .tendrils-fallback {
      width: 100%;
      height: 100%;
      background: radial-gradient(40% 30% at 20% 20%, rgba(0,0,0,0.6), rgba(0,0,0,0) 30%),
                  radial-gradient(50% 40% at 80% 30%, rgba(0,0,0,0.5), rgba(0,0,0,0) 30%),
                  linear-gradient(180deg, rgba(30,30,35,0.6), rgba(10,10,15,0.1));
      pointer-events: none;
      filter: blur(24px);
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body>
  <div id="shadow-tendrils-root">
    <div id="fallback" class="tendrils-fallback" aria-hidden="true" style="display:none"></div>
  </div>

  <script>
  (function(){
    // Use the project's OverlayCommon helper if available
    var root = document.getElementById('shadow-tendrils-root');
    var fallback = document.getElementById('fallback');

    function initFallback(){
      fallback.style.display = 'block';
    }

    function startThree(){
      // Create canvas and attach
      var canvas = document.createElement('canvas');
      canvas.className = 'tendrils-canvas';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      root.insertBefore(canvas, fallback);

      // Minimal three.js shader pass setup without extra libs
      var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(root.clientWidth, root.clientHeight, false);

      var scene = new THREE.Scene();
      var camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

      // Fullscreen quad
      var geometry = new THREE.PlaneGeometry(2,2);

      // Simple 2D value noise / fbm function will be in the fragment shader
      var material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          u_time: { value: 0.0 },
          u_resolution: { value: new THREE.Vector2(root.clientWidth, root.clientHeight) },
          u_mouse: { value: new THREE.Vector2(-10, -10) },
          u_strength: { value: 0.8 }
        },
        vertexShader: `
          varying vec2 v_uv;
          void main(){ v_uv = uv; gl_Position = vec4(position,1.0); }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 v_uv;
          uniform vec2 u_resolution;
          uniform float u_time;
          uniform vec2 u_mouse;
          uniform float u_strength;

          // 2D random
          float rand(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }

          // 2D noise
          float noise(vec2 p){
            vec2 i = floor(p);
            vec2 f = fract(p);
            float a = rand(i);
            float b = rand(i + vec2(1.0, 0.0));
            float c = rand(i + vec2(0.0, 1.0));
            float d = rand(i + vec2(1.0, 1.0));
            vec2 u = f*f*(3.0-2.0*f);
            return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
          }

          // fbm from multiple octaves of noise
          float fbm(vec2 p){
            float v = 0.0;
            float amp = 0.5;
            for(int i=0;i<5;i++){
              v += amp * noise(p);
              p *= 2.0;
              amp *= 0.5;
            }
            return v;
          }

          void main(){
            vec2 uv = v_uv;
            vec2 st = (uv * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
            // Animate
            float t = u_time * 0.12;

              // Base tendril field (higher frequency, more octaves for detail)
              float q = fbm(st * 1.2 + vec2(t * 0.9));
              float r = fbm(st * 2.4 - vec2(t * 1.1));
              float base = fbm(st * 3.2 + (q + r) * 1.6 + vec2(t * 1.2));

              // Directional stretch: make tendrils thin along x and long along y
              // We'll warp the sampling so noise is sampled with stretched coords
              float stretch = 0.18; // smaller -> thinner
              vec2 stretched = vec2(st.x * (1.0 + base * 2.6), st.y * (0.12 + base * 0.9));
              float tend = fbm(stretched * 3.0 + vec2(t * 1.1));

              // Sharpen into ridges: ridge function converts smooth noise to thin peaks
              float ridge = 1.0 - abs(2.0 * (tend - 0.5));
              ridge = pow(ridge, 3.0); // increase exponent -> thinner peaks

              // Tip/erratic modulation: add high-frequency noise that modulates length and sharpness
              float hf = fbm(st * 8.0 + vec2(t * 3.0));
              float tip = smoothstep(0.25, 0.9, ridge + hf * 0.6);

              // Apply taper toward the ends (make tips pointed) so tendrils can come
              // from both the top and bottom of the screen. We create two tapers
              // (top-origin and bottom-origin) and blend their contributions.
              float taperTop = pow(1.0 - smoothstep(0.0, 1.0, uv.y), 2.6);
              float taperBottom = pow(1.0 - smoothstep(0.0, 1.0, 1.0 - uv.y), 2.6);
              // Slightly bias the top and bottom tapers for a natural overlap
              float streakTop = tip * taperTop * 0.98;
              float streakBottom = tip * taperBottom * 0.98;
              // Combine both directional streaks. Use max to preserve strong tips
              // from either side and add a small sum for subtle mid-field detail.
              float streak = max(streakTop, streakBottom) + 0.12 * (streakTop + streakBottom);

              // Mouse influence: a localized intensification of tendrils
              vec2 m = u_mouse / u_resolution;
              float dm = length(uv - m);
              float cursorEffect = exp(-dm * 10.0) * 2.4; // stronger, tighter

              // Compose final shadow tone (dark tendrils on transparent background)
              float shade = clamp(streak * 1.15 + base * 0.06 + cursorEffect * u_strength, 0.0, 1.0);

              // Make the tendrils more contrasty (darker core, softer glow)
              float core = smoothstep(0.45, 0.9, shade);
              float glow = smoothstep(0.05, 0.45, shade) * 0.6;
              float finalAlpha = clamp(core * 0.95 + glow * 0.45, 0.0, 1.0);

              // Color as subtle near-black with bluish tint
              vec3 col = vec3(0.02, 0.03, 0.06) * (0.15 + 0.85 * (1.0 - shade));
              // Soften by vertical falloff but preserve both-edge contribution.
              // We compute a symmetric vertical falloff that is strongest near
              // the edges and slightly reduced in the middle so tendrils from
              // both sides can overlap naturally.
              float edgeFade = smoothstep(0.0, 0.9, uv.y) * smoothstep(0.0, 0.9, 1.0 - uv.y);
              // invert to make it stronger at edges
              edgeFade = 1.0 - edgeFade;
              finalAlpha *= edgeFade;

              gl_FragColor = vec4(col, finalAlpha);
          }
        `
      });

      var quad = new THREE.Mesh(geometry, material);
      scene.add(quad);

      // Interaction
      var mouse = { x: -9999, y: -9999 };
      function onPointerMove(e){
        var rect = canvas.getBoundingClientRect();
        var x = (e.clientX - rect.left) * (canvas.width / rect.width);
        var y = (rect.height - (e.clientY - rect.top)) * (canvas.height / rect.height);
        material.uniforms.u_mouse.value.set(x, y);
      }
      window.addEventListener('pointermove', onPointerMove, { passive: true });

      // Resize handling
      function resize(){
        var w = root.clientWidth; var h = root.clientHeight;
        renderer.setSize(w, h, false);
        material.uniforms.u_resolution.value.set(w, h);
      }
      window.addEventListener('resize', resize);

      // Animation loop
      var clock = new THREE.Clock();
      function render(){
        material.uniforms.u_time.value = clock.getElapsedTime();
        renderer.render(scene, camera);
        requestAnimationFrame(render);
      }
      render();
    }

    // Kick off: check WebGL support via OverlayCommon if present
    var oc = window.OverlayCommon;
    if (oc){
      if (!oc.supportsWebGL()){
        initFallback();
      } else {
        oc.loadThree().then(function(){
          try{ startThree(); }catch(e){ console.error('shadow-tendrils start error', e); initFallback(); }
        }).catch(function(){ initFallback(); });
      }
    } else {
      // No helper available: attempt to detect WebGL directly
      try{
        var c = document.createElement('canvas');
        var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        if (!gl) throw new Error('no webgl');
        // try to load three from CDN and start
        var s = document.createElement('script');
        s.src = 'https://unpkg.com/three@0.158.0/build/three.min.js';
        s.onload = function(){ startThree(); };
        s.onerror = initFallback;
        document.head.appendChild(s);
      }catch(e){ initFallback(); }
    }
  })();
  </script>
</body>
</html>
