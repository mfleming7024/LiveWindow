<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swirling Leaves Animation</title>
    <style>
        /* --- Base Setup --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        /* --- Leaf Container --- */
        #leaf-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
            perspective: 1000px;
        }

        /* --- Leaf Styling --- */
        .leaf {
            position: absolute;
            width: 20px;
            height: 20px;
            background-size: cover;
            
            /* Performance optimization */
            transform: translate3d(0, 0, 0);
            will-change: transform;
            backface-visibility: hidden;
            
            animation-name: leafSwirl, leafFall;
            animation-timing-function: ease-in, ease-in;
            animation-iteration-count: infinite, infinite;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        /* --- Keyframe Animations --- */
        @keyframes leafSwirl {
            0% {
                transform: translate3d(0, 0, 0) rotateZ(0deg) rotateX(0deg);
            }
            25% {
                transform: translate3d(80px, 0, 0) rotateZ(90deg) rotateX(30deg);
            }
            50% {
                transform: translate3d(0, 0, 0) rotateZ(180deg) rotateX(0deg);
            }
            75% {
                transform: translate3d(-80px, 0, 0) rotateZ(270deg) rotateX(-30deg);
            }
            100% {
                transform: translate3d(0, 0, 0) rotateZ(360deg) rotateX(0deg);
            }
        }

        @keyframes leafFall {
            0% {
                transform: translateY(-10vh);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            95% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh);
                opacity: 0;
            }
        }

        /* --- SVG Leaf Generator --- */
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="leaf-container"></div>

    <script>
        // Define leaf SVG patterns (different leaf types)
        const leafShapes = [
            // Oak Leaf
            '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2 Q12 3 12 5 L12 8 Q14 7 15 9 Q13 10 14 12 Q12 11 11 13 Q12 14 10 15 L9 13 Q8 14 6 12 Q7 11 5 9 Q6 7 8 8 L8 5 Q8 3 10 2Z" fill="#CD853F" opacity="0.8"/></svg>',
            // Maple Leaf
            '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 1 L11 6 L15 4 L12 8 L16 9 L11 10 L12 15 L10 12 L8 15 L9 10 L4 9 L8 8 L5 4 L9 6Z" fill="#DC143C" opacity="0.8"/></svg>',
            // Birch Leaf
            '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><ellipse cx="10" cy="10" rx="6" ry="8" fill="#F4A460"/><path d="M10 2 L10 18" stroke="#8B4513" stroke-width="1"/></svg>',
            // Ash Leaf
            '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2 L14 5 L12 10 L14 15 L10 18 L6 15 L8 10 L6 5Z" fill="#DAA520" opacity="0.8"/></svg>',
            // Elm Leaf
            '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 3 Q13 5 13 8 L13 12 Q13 15 10 17 Q7 15 7 12 L7 8 Q7 5 10 3Z" fill="#B8860B" opacity="0.8"/></svg>'
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('leaf-container');
            const numberOfLeaves = 20;

            for (let i = 0; i < numberOfLeaves; i++) {
                setTimeout(() => {
                    createLeaf(container);
                }, i * 400);
            }

            // Continuously add new leaves
            setInterval(() => {
                if (container.children.length < numberOfLeaves) {
                    createLeaf(container);
                }
            }, 800);
        });

        function createLeaf(container) {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            
            // Random leaf shape
            const leafShape = leafShapes[Math.floor(Math.random() * leafShapes.length)];
            leaf.innerHTML = leafShape;

            // Random horizontal starting position
            const xStart = Math.random() * 100;
            leaf.style.left = `${xStart}%`;
            leaf.style.top = '-10vh';

            // Fall duration
            const duration = Math.random() * 12 + 8; // 8-20 seconds
            leaf.style.animationDuration = `${Math.random() * 4 + 4}s, ${duration}s`;

            // Random animation delay
            const delay = Math.random() * 5;
            leaf.style.animationDelay = `${delay}s, ${delay}s`;

            // Random rotation speed
            const rotationSpeed = Math.random() * 1 + 0.5;
            leaf.style.setProperty('--rotation-speed', `${rotationSpeed}s`);

            // Remove leaf after animation completes
            setTimeout(() => {
                leaf.remove();
            }, (duration + delay) * 1000);

            container.appendChild(leaf);
        }
    </script>
</body>
</html>
