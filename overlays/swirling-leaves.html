<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swirling Leaves Animation</title>
    <style>
        /* --- Base Setup --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        /* --- Leaf Container --- */
        #leaf-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
            perspective: 1000px;
        }

        /* --- Leaf Styling --- */
        .leaf {
            position: absolute;
            width: 28px;
            height: 28px;
            pointer-events: none;
        }

        /* wrapper holds the falling + horizontal offset, inner holds rotation/tilt */
        .leaf__wrapper {
            position: absolute;
            inset: 0; /* fills parent */
            transform: translate3d(0, 0, 0);
            will-change: transform;
            animation-name: leafFall;
            animation-timing-function: linear;
            animation-iteration-count: 1;
        }

        .leaf__inner {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: 50% 50%;
            transform: translate(-50%, -50%) rotateZ(0deg);
            will-change: transform;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18));
            animation-name: leafSwirl, leafSway;
            animation-timing-function: ease-in-out, linear;
            animation-iteration-count: infinite, infinite;
        }

        /* --- Keyframe Animations --- */
        @keyframes leafSwirl {
            0% {
                transform: rotateZ(0deg) rotateX(0deg);
            }
            25% {
                transform: rotateZ(90deg) rotateX(30deg);
            }
            50% {
                transform: rotateZ(180deg) rotateX(0deg);
            }
            75% {
                transform: rotateZ(270deg) rotateX(-30deg);
            }
            100% {
                transform: rotateZ(360deg) rotateX(0deg);
            }
        }

        @keyframes leafFall {
            0% {
                transform: translateY(-10vh) translateX(var(--x-offset, 0px));
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            95% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(var(--x-offset, 0px));
                opacity: 0;
            }
        }

        /* horizontal swaying using CSS variable controlled frequency and amplitude */
        @keyframes leafSway {
            0% { transform: translateX(calc(var(--sway-amplitude, 20px)) ) rotateZ(0deg); }
            25% { transform: translateX(calc(var(--sway-amplitude, 20px) * 0.5)) rotateZ(15deg); }
            50% { transform: translateX(calc(var(--sway-amplitude, 0px) * -1)) rotateZ(0deg); }
            75% { transform: translateX(calc(var(--sway-amplitude, 20px) * -0.5)) rotateZ(-15deg); }
            100% { transform: translateX(calc(var(--sway-amplitude, 20px))) rotateZ(0deg); }
        }

        /* --- SVG Leaf Generator --- */
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="leaf-container"></div>

    <script>
        // Define leaf SVG patterns (different leaf types)
        const leafShapes = [
            // Oak Leaf
            '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2 Q12 3 12 5 L12 8 Q14 7 15 9 Q13 10 14 12 Q12 11 11 13 Q12 14 10 15 L9 13 Q8 14 6 12 Q7 11 5 9 Q6 7 8 8 L8 5 Q8 3 10 2Z" fill="#CD853F" opacity="0.8"/></svg>',
            // Maple Leaf
            '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 1 L11 6 L15 4 L12 8 L16 9 L11 10 L12 15 L10 12 L8 15 L9 10 L4 9 L8 8 L5 4 L9 6Z" fill="#DC143C" opacity="0.8"/></svg>',
            // Birch Leaf
            '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><ellipse cx="10" cy="10" rx="6" ry="8" fill="#F4A460"/><path d="M10 2 L10 18" stroke="#8B4513" stroke-width="1"/></svg>',
            // Ash Leaf
            '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2 L14 5 L12 10 L14 15 L10 18 L6 15 L8 10 L6 5Z" fill="#DAA520" opacity="0.8"/></svg>',
            // Elm Leaf
            '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 3 Q13 5 13 8 L13 12 Q13 15 10 17 Q7 15 7 12 L7 8 Q7 5 10 3Z" fill="#B8860B" opacity="0.8"/></svg>'
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('leaf-container');
            const numberOfLeaves = 20;

            for (let i = 0; i < numberOfLeaves; i++) {
                setTimeout(() => createLeaf(container), i * 300);
            }

            // Continuously add new leaves up to target count
            setInterval(() => {
                if (container.children.length < numberOfLeaves) {
                    createLeaf(container);
                }
            }, 900);
        });

        function createLeaf(container) {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';

            // wrapper used for the fall animation and x-offset start
            const wrapper = document.createElement('div');
            wrapper.className = 'leaf__wrapper';

            // inner handles rotation and sway
            const inner = document.createElement('div');
            inner.className = 'leaf__inner';

            // Random leaf shape
            const leafShape = leafShapes[Math.floor(Math.random() * leafShapes.length)];
            inner.innerHTML = leafShape;

            // Random horizontal starting position (percent of container width)
            const xStartPercent = Math.random() * 100;
            leaf.style.left = `${xStartPercent}%`;
            leaf.style.top = '-10vh';

            // Randomized fall duration (8-20s) and initial delay
            const fallDuration = Math.random() * 12 + 8; // seconds
            const delay = Math.random() * 4; // seconds
            wrapper.style.animationDuration = `${fallDuration}s`;
            wrapper.style.animationDelay = `${delay}s`;

            // Random horizontal drift during fall applied as a CSS variable
            // This will offset the leaf's entire fall path by some pixels left/right
            const xOffset = (Math.random() * 200 - 100).toFixed(1); // -100px to 100px
            wrapper.style.setProperty('--x-offset', `${xOffset}px`);

            // Sway amplitude and duration (CSS variables used by leafSway)
            const swayAmp = Math.round(Math.random() * 30 + 8); // 8-38px
            const swayDur = (Math.random() * 4 + 3).toFixed(2); // 3-7s
            const swayDelay = (Math.random() * 3).toFixed(2);
            inner.style.setProperty('--sway-amplitude', `${swayAmp}px`);
            inner.style.animationDuration = `${Math.random() * 4 + 4}s, ${swayDur}s`;
            inner.style.animationDelay = `${delay}s, ${swayDelay}s`;

            // Random rotation speed (affects leafSwirl cycle duration)
            const swirlDur = (Math.random() * 6 + 4).toFixed(2); // 4-10s
            // leafSwirl is the first animation on inner
            inner.style.animationDuration = `${swirlDur}s, ${swayDur}s`;
            inner.style.animationDelay = `0s, ${swayDelay}s`;

            // Random scale for variety
            const scale = (Math.random() * 0.7 + 0.7).toFixed(2); // 0.7 - 1.4
            inner.style.transform = `translate(-50%, -50%) scale(${scale})`;

            // Slight random 3D tilt
            const tiltX = (Math.random() * 40 - 20).toFixed(1);
            inner.style.setProperty('--tilt-x', `${tiltX}deg`);

            // Remove leaf after it finishes falling (duration + delay) plus small buffer
            const totalLife = Math.ceil((fallDuration + delay) * 1000 + 500);
            setTimeout(() => {
                leaf.remove();
            }, totalLife);

            // Append structure: leaf -> wrapper -> inner(svg)
            wrapper.appendChild(inner);
            leaf.appendChild(wrapper);
            container.appendChild(leaf);
        }
    </script>
</body>
</html>
